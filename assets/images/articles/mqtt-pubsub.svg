<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Source Sans Pro', 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#e4ecf7"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- connecting lines -->
  <line x1="425" y1="300" x2="485" y2="300" stroke="#b9c6dc" stroke-width="3"/>
  <line x1="715" y1="300" x2="775" y2="300" stroke="#b9c6dc" stroke-width="3"/>

  <!-- travelling message dots -->
  <circle cx="450" cy="300" r="7" fill="rgb(112,195,148)"/>
  <circle cx="740" cy="300" r="7" fill="rgb(112,195,148)"/>

  <!-- Publisher node -->
  <g>
    <rect x="200" y="230" width="220" height="140" rx="18" fill="rgb(113,178,222)"/>
    <circle cx="310" cy="280" r="16" fill="#ffffff" opacity="0.9"/>
    <path d="M300 280 q10 -14 20 0" stroke="rgb(113,178,222)" stroke-width="3" fill="none"/>
    <text x="310" y="330" text-anchor="middle" font-size="22" fill="#ffffff" font-weight="600">Publisher</text>
    <text x="310" y="353" text-anchor="middle" font-size="14" fill="#eaf2fb">e.g. a sensor</text>
  </g>

  <!-- Broker node (emphasized) -->
  <g>
    <rect x="490" y="210" width="220" height="180" rx="18" fill="rgb(124,142,222)"/>
    <circle cx="565" cy="270" r="10" fill="#ffffff"/>
    <circle cx="600" cy="255" r="10" fill="#ffffff"/>
    <circle cx="635" cy="270" r="10" fill="#ffffff"/>
    <line x1="565" y1="270" x2="600" y2="255" stroke="#ffffff" stroke-width="2"/>
    <line x1="600" y1="255" x2="635" y2="270" stroke="#ffffff" stroke-width="2"/>
    <line x1="565" y1="270" x2="600" y2="300" stroke="#ffffff" stroke-width="2"/>
    <line x1="635" y1="270" x2="600" y2="300" stroke="#ffffff" stroke-width="2"/>
    <circle cx="600" cy="300" r="10" fill="#ffffff"/>
    <text x="600" y="345" text-anchor="middle" font-size="22" fill="#ffffff" font-weight="600">Broker</text>
    <text x="600" y="368" text-anchor="middle" font-size="14" fill="#eaeaff">routes every topic</text>
  </g>

  <!-- Subscriber node -->
  <g>
    <rect x="780" y="230" width="220" height="140" rx="18" fill="rgb(230,133,172)"/>
    <rect x="845" y="270" width="70" height="45" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="855" y="280" width="10" height="25" fill="rgb(230,133,172)"/>
    <rect x="870" y="287" width="10" height="18" fill="rgb(230,133,172)"/>
    <rect x="885" y="275" width="10" height="30" fill="rgb(230,133,172)"/>
    <text x="890" y="330" text-anchor="middle" font-size="22" fill="#ffffff" font-weight="600">Subscriber</text>
    <text x="890" y="353" text-anchor="middle" font-size="14" fill="#fdeaf1">e.g. a dashboard</text>
  </g>

  <text x="600" y="455" text-anchor="middle" font-size="17" fill="#5a6b8c">publish / subscribe &#8212; decoupled by topic</text>
</svg>
