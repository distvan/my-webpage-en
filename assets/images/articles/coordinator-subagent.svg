<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Source Sans Pro', 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#e4ecf7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#96a8cc"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- left delegate / answer arrows -->
  <path d="M560,180 C 470,230 340,260 285,328" stroke="#96a8cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M315,328 C 400,262 500,232 580,180" stroke="#96a8cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="405" y="245" text-anchor="middle" font-size="14" fill="#5a6b8c">delegate / answer</text>
  <circle cx="330" cy="290" r="6" fill="rgb(112,195,148)"/>

  <!-- right delegate / answer arrows -->
  <path d="M660,180 C 750,230 875,260 925,328" stroke="#96a8cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M905,328 C 815,262 715,232 640,180" stroke="#96a8cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="800" y="245" text-anchor="middle" font-size="14" fill="#5a6b8c">delegate / answer</text>
  <circle cx="875" cy="290" r="6" fill="rgb(112,195,148)"/>

  <!-- Coordinator node -->
  <g>
    <rect x="480" y="40" width="240" height="140" rx="18" fill="rgb(124,142,222)"/>
    <circle cx="555" cy="90" r="10" fill="#ffffff"/>
    <circle cx="600" cy="80" r="10" fill="#ffffff"/>
    <circle cx="645" cy="90" r="10" fill="#ffffff"/>
    <line x1="555" y1="90" x2="600" y2="80" stroke="#ffffff" stroke-width="2"/>
    <line x1="600" y1="80" x2="645" y2="90" stroke="#ffffff" stroke-width="2"/>
    <line x1="555" y1="90" x2="600" y2="112" stroke="#ffffff" stroke-width="2"/>
    <line x1="645" y1="90" x2="600" y2="112" stroke="#ffffff" stroke-width="2"/>
    <circle cx="600" cy="112" r="10" fill="#ffffff"/>
    <text x="600" y="150" text-anchor="middle" font-size="22" fill="#ffffff" font-weight="600">Coordinator</text>
    <text x="600" y="172" text-anchor="middle" font-size="14" fill="#eaeaff">delegates &amp; combines</text>
  </g>

  <!-- left isolation boundary + Order subagent -->
  <rect x="90" y="330" width="320" height="190" rx="22" fill="none" stroke="#96a8cc" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="250" y="350" text-anchor="middle" font-size="13" fill="#5a6b8c">isolated context</text>
  <g>
    <rect x="130" y="360" width="240" height="130" rx="16" fill="rgb(113,178,222)"/>
    <rect x="210" y="380" width="80" height="50" rx="4" fill="#ffffff" opacity="0.95"/>
    <line x1="220" y1="393" x2="280" y2="393" stroke="rgb(113,178,222)" stroke-width="4"/>
    <line x1="220" y1="405" x2="280" y2="405" stroke="rgb(113,178,222)" stroke-width="4"/>
    <line x1="220" y1="417" x2="260" y2="417" stroke="rgb(113,178,222)" stroke-width="4"/>
    <text x="250" y="455" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="600">Order subagent</text>
    <text x="250" y="475" text-anchor="middle" font-size="13" fill="#eaf2fb">own loop, own tools</text>
  </g>

  <!-- right isolation boundary + Pricing subagent -->
  <rect x="790" y="330" width="320" height="190" rx="22" fill="none" stroke="#96a8cc" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="950" y="350" text-anchor="middle" font-size="13" fill="#5a6b8c">isolated context</text>
  <g>
    <rect x="830" y="360" width="240" height="130" rx="16" fill="rgb(230,133,172)"/>
    <text x="950" y="425" text-anchor="middle" font-size="40" fill="#ffffff" font-weight="700">$</text>
    <text x="950" y="455" text-anchor="middle" font-size="20" fill="#ffffff" font-weight="600">Pricing subagent</text>
    <text x="950" y="475" text-anchor="middle" font-size="13" fill="#fdeaf1">own loop, own tools</text>
  </g>

  <text x="600" y="565" text-anchor="middle" font-size="17" fill="#5a6b8c">coordinator + subagents &#8212; one loop orchestrating others</text>
</svg>
