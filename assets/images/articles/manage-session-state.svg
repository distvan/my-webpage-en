<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Source Sans Pro', 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#e4ecf7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#96a8cc"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- top -> two forks -->
  <path d="M555,140 C 460,165 320,172 250,188" stroke="#96a8cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M645,140 C 740,165 880,172 950,188" stroke="#96a8cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="176" text-anchor="middle" font-size="13" fill="#5a6b8c">fork_session &#8212; copy, not merge</text>

  <!-- left fork -> warning -->
  <path d="M250,290 L 250,333" stroke="#96a8cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- warning -> two outcomes -->
  <path d="M220,390 C 200,405 190,415 175,428" stroke="#96a8cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M290,390 C 340,408 380,415 420,428" stroke="#96a8cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <!-- session node -->
  <g>
    <rect x="480" y="30" width="240" height="110" rx="18" fill="rgb(124,142,222)"/>
    <rect x="565" y="55" width="70" height="55" rx="6" fill="#ffffff" opacity="0.95"/>
    <rect x="578" y="62" width="44" height="14" rx="2" fill="rgb(124,142,222)"/>
    <line x1="578" y1="86" x2="622" y2="86" stroke="rgb(124,142,222)" stroke-width="3"/>
    <line x1="578" y1="94" x2="610" y2="94" stroke="rgb(124,142,222)" stroke-width="3"/>
    <text x="600" y="128" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="600">cache-investigation</text>
  </g>
  <text x="600" y="20" text-anchor="middle" font-size="12.5" fill="#5a6b8c" font-style="italic">a session is the messages list, saved under a name</text>

  <!-- left fork node -->
  <g>
    <rect x="110" y="190" width="280" height="100" rx="16" fill="rgb(113,178,222)"/>
    <rect x="140" y="208" width="34" height="44" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="150" y="200" width="34" height="44" rx="4" fill="#ffffff"/>
    <text x="270" y="245" text-anchor="middle" font-size="17" fill="#ffffff" font-weight="600">&#8230;-thread-safety</text>
    <text x="270" y="266" text-anchor="middle" font-size="12" fill="#eaf2fb">resumed with its own question</text>
  </g>

  <!-- right fork node -->
  <g>
    <rect x="810" y="190" width="280" height="100" rx="16" fill="rgb(113,178,222)"/>
    <rect x="840" y="208" width="34" height="44" rx="4" fill="#ffffff" opacity="0.9"/>
    <rect x="850" y="200" width="34" height="44" rx="4" fill="#ffffff"/>
    <text x="970" y="245" text-anchor="middle" font-size="17" fill="#ffffff" font-weight="600">&#8230;-ttl</text>
    <text x="970" y="266" text-anchor="middle" font-size="12" fill="#eaf2fb">resumed with its own question</text>
  </g>
  <text x="950" y="330" text-anchor="middle" font-size="12.5" fill="#8091b8" font-style="italic">diverges independently &#8212;</text>
  <text x="950" y="347" text-anchor="middle" font-size="12.5" fill="#8091b8" font-style="italic">never touches the other branch's file</text>

  <!-- warning node: file changed mid-investigation -->
  <g>
    <rect x="110" y="335" width="280" height="55" rx="10" fill="rgb(230,173,94)"/>
    <polygon points="140,378 152,357 164,378" fill="#ffffff"/>
    <line x1="152" y1="363" x2="152" y2="370" stroke="rgb(230,173,94)" stroke-width="2"/>
    <circle cx="152" cy="374" r="1.4" fill="rgb(230,173,94)"/>
    <text x="280" y="367" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="600">cache.py edited mid-investigation</text>
    <text x="280" y="382" text-anchor="middle" font-size="11" fill="#fff3e2">gains a threading.Lock</text>
  </g>

  <!-- blind resume outcome -->
  <g>
    <rect x="40" y="430" width="230" height="110" rx="16" fill="rgb(158,166,190)"/>
    <circle cx="85" cy="465" r="14" fill="none" stroke="#ffffff" stroke-width="3"/>
    <line x1="76" y1="456" x2="94" y2="474" stroke="#ffffff" stroke-width="3"/>
    <line x1="94" y1="456" x2="76" y2="474" stroke="#ffffff" stroke-width="3"/>
    <text x="155" y="470" text-anchor="middle" font-size="15" fill="#ffffff" font-weight="600">blind resume</text>
    <text x="155" y="492" text-anchor="middle" font-size="11.5" fill="#eef0f7">answers from the stale</text>
    <text x="155" y="507" text-anchor="middle" font-size="11.5" fill="#eef0f7">tool result already in history</text>
    <text x="155" y="524" text-anchor="middle" font-size="10.5" fill="#dfe2ee" font-style="italic">a gamble, not a guarantee</text>
  </g>

  <!-- informed / fresh-with-summary outcome -->
  <g>
    <rect x="290" y="430" width="330" height="110" rx="16" fill="rgb(230,133,172)"/>
    <circle cx="325" cy="465" r="14" fill="none" stroke="#ffffff" stroke-width="3"/>
    <path d="M318,465 l5,6 l11,-13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="475" y="470" text-anchor="middle" font-size="13.5" fill="#ffffff" font-weight="600">told what changed, or restarted fresh</text>
    <text x="475" y="492" text-anchor="middle" font-size="11.5" fill="#fdeaf1">current state is already in the prompt</text>
    <text x="475" y="507" text-anchor="middle" font-size="11.5" fill="#fdeaf1">no stale history competing for attention</text>
    <text x="475" y="524" text-anchor="middle" font-size="10.5" fill="#fbdce8" font-style="italic">the answer no longer depends on luck</text>
  </g>

  <text x="600" y="580" text-anchor="middle" font-size="17" fill="#5a6b8c">session state &#8212; fork shares a baseline, staleness has to be told, not assumed</text>
</svg>
