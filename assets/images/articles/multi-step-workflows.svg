<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" font-family="'Source Sans Pro', 'Segoe UI', Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef4fb"/>
      <stop offset="100%" stop-color="#e4ecf7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#96a8cc"/>
    </marker>
  </defs>

  <rect width="1200" height="600" fill="url(#bg)"/>

  <!-- Agent -> get_customer / process_refund -->
  <path d="M555,175 C 460,200 320,205 250,228" stroke="#96a8cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M645,175 C 740,200 880,205 950,228" stroke="#96a8cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="205" text-anchor="middle" font-size="14" fill="#5a6b8c">both reachable in either order</text>

  <!-- horizontal gate arrow between the two tool nodes -->
  <path d="M355,295 L 845,295" stroke="#96a8cc" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="600" y="270" text-anchor="middle" font-size="14" fill="#5a6b8c">gate: verified_customers check</text>
  <text x="600" y="315" text-anchor="middle" font-size="12" fill="#8091b8" font-style="italic">code decides, not the prompt</text>

  <!-- padlock icon on the gate -->
  <g transform="translate(600,295)">
    <rect x="-16" y="-4" width="32" height="26" rx="4" fill="#ffffff" stroke="rgb(112,195,148)" stroke-width="3"/>
    <path d="M-10,-4 v-10 a10,10 0 0 1 20,0 v10" fill="none" stroke="rgb(112,195,148)" stroke-width="3"/>
    <circle cx="0" cy="9" r="3.5" fill="rgb(112,195,148)"/>
  </g>

  <!-- Agent node -->
  <g>
    <rect x="480" y="40" width="240" height="135" rx="18" fill="rgb(124,142,222)"/>
    <circle cx="555" cy="88" r="10" fill="#ffffff"/>
    <circle cx="600" cy="78" r="10" fill="#ffffff"/>
    <circle cx="645" cy="88" r="10" fill="#ffffff"/>
    <line x1="555" y1="88" x2="600" y2="78" stroke="#ffffff" stroke-width="2"/>
    <line x1="600" y1="78" x2="645" y2="88" stroke="#ffffff" stroke-width="2"/>
    <line x1="555" y1="88" x2="600" y2="110" stroke="#ffffff" stroke-width="2"/>
    <line x1="645" y1="88" x2="600" y2="110" stroke="#ffffff" stroke-width="2"/>
    <circle cx="600" cy="110" r="10" fill="#ffffff"/>
    <text x="600" y="145" text-anchor="middle" font-size="22" fill="#ffffff" font-weight="600">Support Agent</text>
    <text x="600" y="166" text-anchor="middle" font-size="14" fill="#eaeaff">multiple tool_use blocks, one turn</text>
  </g>

  <!-- get_customer -->
  <g>
    <rect x="110" y="230" width="240" height="130" rx="16" fill="rgb(113,178,222)"/>
    <circle cx="230" cy="278" r="22" fill="#ffffff" opacity="0.95"/>
    <circle cx="230" cy="271" r="9" fill="rgb(113,178,222)"/>
    <path d="M212,296 a18,14 0 0 1 36,0 z" fill="rgb(113,178,222)"/>
    <text x="230" y="325" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="600">get_customer</text>
    <text x="230" y="345" text-anchor="middle" font-size="13" fill="#eaf2fb">marks customer verified</text>
  </g>

  <!-- process_refund -->
  <g>
    <rect x="850" y="230" width="240" height="130" rx="16" fill="rgb(113,178,222)"/>
    <rect x="930" y="255" width="80" height="55" rx="6" fill="#ffffff" opacity="0.95"/>
    <text x="970" y="290" text-anchor="middle" font-size="22" fill="rgb(113,178,222)" font-weight="700">$</text>
    <text x="970" y="325" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="600">process_refund</text>
    <text x="970" y="345" text-anchor="middle" font-size="13" fill="#eaf2fb">checks the gate first</text>
  </g>

  <!-- Agent -> escalate_to_human -->
  <path d="M600,175 L 600,428" stroke="#96a8cc" stroke-width="3" stroke-dasharray="6,6" fill="none" marker-end="url(#arrow)"/>
  <text x="640" y="405" text-anchor="start" font-size="14" fill="#5a6b8c">when it can't finish alone</text>

  <!-- escalate_to_human -->
  <g>
    <rect x="480" y="430" width="240" height="130" rx="18" fill="rgb(230,133,172)"/>
    <text x="600" y="470" text-anchor="middle" font-size="19" fill="#ffffff" font-weight="600">escalate_to_human</text>
    <text x="600" y="492" text-anchor="middle" font-size="12.5" fill="#fdeaf1">required: customer_id,</text>
    <text x="600" y="509" text-anchor="middle" font-size="12.5" fill="#fdeaf1">root_cause, recommended_action</text>
    <text x="600" y="530" text-anchor="middle" font-size="12" fill="#fbdce8" font-style="italic">complete by construction</text>
  </g>

  <text x="600" y="590" text-anchor="middle" font-size="17" fill="#5a6b8c">multi-step workflows &#8212; programmatic gate, parallel calls, complete handoff</text>
</svg>
